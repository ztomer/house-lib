[package]
name = "house-lib"
version = "0.1.0"
edition = "2024"
# The floor sys_updater, app_updates and ztools already build on; the code here
# uses nothing newer (let-chains are 1.88, edition 2024 is 1.85).
rust-version = "1.93"
description = "The private shared library of the house tools: self-heal, the platform policy, ~ expansion, the detached spawn, and the Camoufox dependency rows."
license = "MIT"
publish = false
build = "build.rs"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
exit = "warn"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
# setsid for the detaching trampoline (spawn.rs): safe in rustix, where std
# offers it only behind `unsafe` (`pre_exec`) or an unstable API.
rustix = { version = "1.1.6", features = ["process"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
